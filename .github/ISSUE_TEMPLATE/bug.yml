name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks! Please **don't attach your export or screenshots of your data**. Sample data is perfect for showing UI bugs.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Which part?
      options: [Spotify, Instagram, YouTube, Import / upload, Share card, Landing or guides, Other]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 19 on iPhone 15, Chrome 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors (optional)
      render: text
