name: Export format changed
description: Unpacked says an export's format changed or can't be read
labels: [format-changed]
body:
  - type: markdown
    attributes:
      value: |
        Paste the **format report** from the error panel. It lists key names and types only, never values.
        Please don't paste anything from inside your export files.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Spotify, Instagram, YouTube]
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When did you request the export?
      placeholder: November 2026
  - type: textarea
    id: report
    attributes:
      label: Format report
      render: text
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Account language (optional)
      description: Some exports use translated file names.
